command:
  - uv
  - run
  - salesforce-mcp-server

env:
  # uv install tuning for the Apps build sandbox: the internal PyPI proxy can
  # be slow, and uv's default 30s HTTP timeout + high concurrency causes
  # "operation timed out" on random wheels. Raise the timeout and serialize
  # downloads so a slow proxy doesn't trip the deadline.
  - name: UV_HTTP_TIMEOUT
    value: "300"
  - name: UV_CONCURRENT_DOWNLOADS
    value: "1"

  # Deny-by-default allowlists enforced by the MCP server (not the LLM).
  # Comma-separated. Leave empty for permissive local testing.
  - name: ALLOWED_CATALOGS
    value: ""
  - name: ALLOWED_SCHEMAS
    value: ""      # entries look like "main.salesforce_raw"
  - name: ALLOWED_CONNECTIONS
    value: ""

  # Salesforce source-object discovery (list_source_objects). Databricks has no
  # API that enumerates SObjects for a connection, so discovery queries the
  # Salesforce org directly via describeGlobal. These are a SEPARATE connected
  # app from the UC connection's OAuth secret (which the app cannot read).
  # Without them, list_source_objects returns a curated list of common standard
  # objects; with them, it returns all queryable objects incl. custom (__c).
  # Global defaults (used when no per-connection override is set):
  #   SF_INSTANCE_URL, SF_CLIENT_ID, SF_CLIENT_SECRET, SF_API_VERSION, SF_TOKEN
  # Per-connection overrides use the upper-cased connection name, e.g. for
  # connection "con_salesforce_prd":
  #   SF_CON_SALESFORCE_PRD_INSTANCE_URL, SF_CON_SALESFORCE_PRD_CLIENT_ID, ...
  # Prefer sourcing secrets from a Databricks secret scope rather than plaintext.
  # - name: SF_INSTANCE_URL
  #   value: "https://<domain>.my.salesforce.com"
